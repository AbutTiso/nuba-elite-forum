{% extends 'custom_admin/base.html' %}{% block title %}Edit Article | NEF Admin{% endblock %}
{% block content %}<h1 class='text-2xl font-extrabold text-[#062B57] mb-6'>Edit Article</h1><div class='bg-white rounded-2xl p-6 border border-gray-100'><form method='post' class='space-y-4'>{% csrf_token %}<div><label class='block text-sm font-semibold mb-1'>Title</label><input type='text' name='title' value='{{ article.title }}' class='w-full px-4 py-2 border rounded-xl text-sm' required></div><div><label class='block text-sm font-semibold mb-1'>Content</label><textarea name='content' rows='10' class='w-full px-4 py-2 border rounded-xl text-sm' required>{{ article.content }}</textarea></div><button type='submit' class='px-6 py-2.5 bg-[#062B57] text-white rounded-full font-bold border-2 border-[#C8A24C] hover:bg-[#C8A24C] hover:text-[#062B57]'>Update</button></form></div>{% endblock %}
