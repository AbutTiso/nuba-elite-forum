{% extends 'custom_admin/base.html' %}
{% block title %}Create Article | NEF Admin{% endblock %}
{% block header %}Create Article{% endblock %}
{% block content %}

<div class='max-w-3xl mx-auto'>
    <div class='bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden'>
        <div class='px-6 py-4 border-b border-gray-100 bg-[#F9F9F7]'>
            <h3 class='font-bold text-sm text-[#062B57]'>New Article</h3>
            <p class='text-xs text-gray-400 mt-0.5'>Fill in the details below to publish a new article</p>
        </div>
        <div class='p-6'>
            <form method='post' class='space-y-5'>
                {% csrf_token %}
                
                <div class='grid md:grid-cols-2 gap-4'>
                    <div>
                        <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Title <span class='text-red-400'>*</span></label>
                        <input type='text' name='title' placeholder='Enter article title...' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all' required>
                    </div>
                    <div>
                        <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Slug <span class='text-red-400'>*</span></label>
                        <input type='text' name='slug' placeholder='article-url-slug' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all' required>
                    </div>
                </div>
                
                <div class='grid md:grid-cols-3 gap-4'>
                    <div>
                        <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Category</label>
                        <select name='category' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all bg-white'>
                            {% for cat in categories %}
                            <option value='{{ cat.id }}'>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Author</label>
                        <input type='text' name='author' value='NEF Editorial' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all'>
                    </div>
                    <div>
                        <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Status</label>
                        <select name='status' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all bg-white'>
                            <option value='published'>Published</option>
                            <option value='draft'>Draft</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Excerpt</label>
                    <textarea name='excerpt' rows='2' placeholder='Brief summary of the article...' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all resize-none'></textarea>
                </div>
                
                <div>
                    <label class='block text-sm font-semibold text-[#062B57] mb-1.5'>Content <span class='text-red-400'>*</span></label>
                    <textarea name='content' rows='12' placeholder='Write your article content here...' class='w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 transition-all resize-y' required></textarea>
                </div>
                
                <div class='flex items-center gap-3 pt-2'>
                    <button type='submit' class='btn-primary'>
                        <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5' d='M5 13l4 4L19 7'/></svg>
                        Publish Article
                    </button>
                    <a href='/manage/articles/' class='btn-secondary'>Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
