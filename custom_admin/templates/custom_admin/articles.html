{% extends 'custom_admin/base.html' %}{% block title %}Articles | NEF Admin{% endblock %}
{% block content %}
<div class='flex items-center justify-between mb-6'><h1 class='text-2xl font-extrabold text-[#062B57]'>Articles</h1><a href='/manage/articles/create/' class='px-4 py-2 bg-[#062B57] text-white rounded-full font-semibold text-sm border-2 border-[#C8A24C] hover:bg-[#C8A24C] hover:text-[#062B57]'>+ New Article</a></div>
<div class='bg-white rounded-2xl border border-gray-100 overflow-x-auto'><table class='w-full'><thead class='bg-[#F9F9F7]'><tr><th class='text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase'>Title</th><th class='text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase'>Status</th><th class='text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase'>Actions</th></tr></thead><tbody class='divide-y divide-gray-50'>{% for article in articles %}<tr class='hover:bg-gray-50'><td class='px-6 py-4 text-sm font-semibold'>{{ article.title }}</td><td class='px-6 py-4'><span class='text-xs px-3 py-1 rounded-full font-semibold {% if article.status == 'published' %}bg-green-100 text-green-700{% else %}bg-gray-100 text-gray-500{% endif %}'>{{ article.status|title }}</span></td><td class='px-6 py-4 text-right'><a href='/manage/articles/{{ article.id }}/edit/' class='text-xs text-[#C8A24C] mr-3'>Edit</a><a href='/manage/articles/{{ article.id }}/delete/' class='text-xs text-red-400' onclick='return confirm(\"Delete?\")'>Delete</a></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
