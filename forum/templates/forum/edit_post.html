{% extends 'base.html' %}{% block title %}Edit Reply — NEF{% endblock %}
{% block content %}
<section class='min-h-screen pt-24 pb-16 bg-white'><div class='max-w-2xl mx-auto px-4'>
<h1 class='text-3xl font-extrabold text-[#062B57] mb-8'>Edit Reply</h1>
<form method='post' class='bg-[#F9F9F7] rounded-2xl p-8 border border-gray-100'>
{% csrf_token %}
<textarea name='content' rows='6' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] text-sm'>{{ post.content }}</textarea>
<button type='submit' class='mt-4 px-6 py-2.5 bg-[#062B57] text-white font-bold rounded-full border-2 border-[#C8A24C] hover:bg-[#C8A24C] transition-all text-sm'>Save Changes</button>
<a href='/forum/thread/{{ post.thread.slug }}/' class='text-gray-400 text-sm ml-3'>Cancel</a>
</form></div></section>
{% endblock %}
