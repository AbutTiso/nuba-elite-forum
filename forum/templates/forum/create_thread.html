{% extends 'base.html' %}
{% block title %}New Thread — {{ category.name }} | NEF{% endblock %}

{% block content %}

<section class='relative pt-24 pb-16 bg-[#062B57] overflow-hidden'>
    <div class='absolute inset-0 opacity-[0.04]'>
        <div class='absolute inset-0' style='background-image: radial-gradient(circle at 20px 20px, #C8A24C 1px, transparent 0); background-size: 40px 40px;'></div>
    </div>
    <div class='relative max-w-4xl mx-auto px-4 text-center'>
        <span class='inline-block text-[#C8A24C] font-semibold text-xs uppercase tracking-[0.2em] bg-[#C8A24C]/10 px-3 py-1 rounded-full mb-4'>{{ category.icon }} {{ category.name }}</span>
        <h1 class='text-4xl font-extrabold text-white mb-3' style='font-family: Montserrat, sans-serif;'>Create New Thread</h1>
        <div class='w-20 h-0.5 bg-gradient-to-r from-transparent via-[#C8A24C] to-transparent mx-auto'></div>
    </div>
</section>

<section class='py-16 bg-white'>
    <div class='max-w-2xl mx-auto px-4'>
        <form method='post' class='bg-gradient-to-br from-[#F9F9F7] to-white rounded-2xl p-8 border border-gray-100 shadow-sm'>
            {% csrf_token %}
            <div class='space-y-5'>
                <div>
                    <label class='block text-sm font-semibold text-[#062B57] mb-2'>Thread Title <span class='text-red-400'>*</span></label>
                    <input type='text' name='title' placeholder='What would you like to discuss?' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 text-sm transition-all' required>
                </div>
                <div>
                    <label class='block text-sm font-semibold text-[#062B57] mb-2'>Content <span class='text-red-400'>*</span></label>
                    <textarea name='content' rows='10' placeholder='Share your thoughts, ideas, or questions with the community...' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 resize-none text-sm transition-all' required></textarea>
                </div>
                <div>
                    <label class='block text-sm font-semibold text-[#062B57] mb-2'>Tags</label>
                    <input type='text' name='tags' placeholder='e.g., education, peace, youth (comma separated)' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] focus:ring-2 focus:ring-[#C8A24C]/10 text-sm transition-all'>
                    <p class='text-gray-400 text-xs mt-1'>Separate tags with commas — makes your thread easier to find</p>
                </div>
                <div class='flex items-center gap-4 pt-2'>
                    <button type='submit' class='px-8 py-3 bg-[#062B57] text-white font-bold rounded-full border-2 border-[#C8A24C] hover:bg-[#C8A24C] hover:text-[#062B57] transition-all duration-300 shadow-md hover:shadow-lg'>
                        Create Thread
                    </button>
                    <a href='{% url 'forum:category' category.slug %}' class='text-gray-400 hover:text-[#062B57] text-sm transition-colors'>Cancel</a>
                </div>
            </div>
        </form>
    </div>
</section>

{% endblock %}
