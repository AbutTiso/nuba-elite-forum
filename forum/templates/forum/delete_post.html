{% extends 'base.html' %}{% block title %}Delete Reply — NEF{% endblock %}
{% block content %}
<section class='min-h-screen pt-24 pb-16 bg-white'><div class='max-w-2xl mx-auto px-4 text-center'>
<h1 class='text-3xl font-extrabold text-[#062B57] mb-4'>Delete Reply?</h1>
<p class='text-gray-500 mb-8'>This cannot be undone.</p>
<form method='post' class='flex justify-center gap-4'>
{% csrf_token %}
<button type='submit' class='px-6 py-2.5 bg-red-500 text-white font-bold rounded-full hover:bg-red-600 transition-all text-sm'>Delete</button>
<a href='/forum/thread/{{ post.thread.slug }}/' class='px-6 py-2.5 border-2 border-gray-200 text-gray-500 rounded-full font-semibold text-sm'>Cancel</a>
</form></div></section>
{% endblock %}
