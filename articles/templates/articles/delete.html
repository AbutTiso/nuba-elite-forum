{% extends 'base.html' %}{% block title %}Delete Article — NEF{% endblock %}
{% block content %}
<section class='min-h-screen pt-24 pb-16 bg-white flex items-center'><div class='max-w-2xl mx-auto px-4 text-center'>
<div class='w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-6'>
<svg class='w-8 h-8 text-red-500' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16'/></svg></div>
<h1 class='text-3xl font-extrabold text-[#062B57] mb-2'>Delete Article?</h1>
<p class='text-gray-500 mb-2'>\"{{ article.title }}\"</p>
<p class='text-red-500 text-sm mb-8'>This cannot be undone.</p>
<form method='post' class='flex justify-center gap-4'>{% csrf_token %}
<button type='submit' class='px-8 py-3 bg-red-500 text-white font-bold rounded-full hover:bg-red-600 transition-all'>Delete</button>
<a href='/articles/{{ article.slug }}/' class='px-8 py-3 border-2 border-gray-200 text-gray-500 rounded-full font-semibold'>Cancel</a>
</form></div></section>
{% endblock %}
