{% extends 'base.html' %}{% block title %}Edit Article — NEF{% endblock %}
{% block content %}
<section class='min-h-screen pt-24 pb-16 bg-white'><div class='max-w-3xl mx-auto px-4'>
<h1 class='text-3xl font-extrabold text-[#062B57] mb-8'>Edit Article</h1>
<form method='post' class='bg-[#F9F9F7] rounded-2xl p-8 border border-gray-100'>
{% csrf_token %}
<div class='space-y-5'>
<div><label class='block text-sm font-semibold text-[#062B57] mb-2'>Title</label>
<input type='text' name='title' value='{{ article.title }}' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] text-sm' required></div>
<div><label class='block text-sm font-semibold text-[#062B57] mb-2'>Content</label>
<textarea name='content' rows='15' class='w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#C8A24C] text-sm' required>{{ article.content }}</textarea></div>
<button type='submit' class='px-8 py-3 bg-[#062B57] text-white font-bold rounded-full border-2 border-[#C8A24C] hover:bg-[#C8A24C] transition-all'>Save Changes</button>
<a href='/articles/{{ article.slug }}/' class='text-gray-400 text-sm ml-3'>Cancel</a>
</div></form></div></section>
{% endblock %}
